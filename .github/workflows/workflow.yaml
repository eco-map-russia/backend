name: Build & Push Docker image eco-map-app

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/iraserg/eco-map-app
  SHORT_SHA: ${{ github.sha }}
  IMAGE_TAG: ghcr.io/iraserg/eco-map-app:${{ github.sha }}

jobs:

  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          output-file: hadolint-report.txt

      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-report
          path: hadolint-report.txt

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0.3
        with:
          envkey_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          envkey_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          envkey_DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          envkey_DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          envkey_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          file_name: .env

      - name: Build project with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          echo "Building image ${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE_TAG}" \
            --load .

      - name: Save Docker image as artifact
        run: |
          docker save "${IMAGE_TAG}" | gzip > image.tar.gz
          echo "Image saved as artifact."

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  push:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image from artifact
        run: |
          gunzip -c image.tar.gz | docker load
          echo "Image loaded from artifact."

      - name: Image tag
        run: echo "MAGE_TAG=${IMAGE_TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push "${IMAGE_TAG}"
