openapi: 3.1.0
info:
  title: Eco Map API
  version: 1.0.0
  description: API для Экологической карты РФ

servers:
  - url: http://localhost:8080/api/v1
    description: Local Dev
security:
  - bearerAuth: [ ]
paths:
  /me:
    get:
      tags:
        - Users
      summary: Получить профиль пользователя
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Профиль текущего пользователя успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Users
      summary: Обновить профиль текущего пользователя
      operationId: updateCurrentUserProfile
      requestBody:
        description: Обновленные данные пользователя
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequestDto'
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Профиль текущего пользователя успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/soil:
    post:
      tags:
        - AdminSoilData
      summary: Добавить данные о состоянии почвы
      operationId: addSoilData
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoilDataRequestDto'
      responses:
        '201':
          description: Данные о почве успешно созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - AdminSoilData
      summary: Получить список данных о состоянии почвы
      operationId: getSoilData
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список записей о состоянии почвы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSoilDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/soil/{id}:
    put:
      tags:
        - AdminSoilData
      summary: Обновить данные о состоянии почвы
      operationId: updateSoilData
      parameters:
        - name: id
          in: path
          required: true
          description: ID записи почвы для обновления
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSoilDataRequestDto'

      responses:
        '200':
          description: Запись о состоянии почвы успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - AdminSoilData
      summary: Удалить запись о данных почвы
      operationId: deleteSoilData
      parameters:
        - name: id
          in: path
          required: true
          description: ID записи почвы для удаления
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Успешное удаление. Тело ответа отсутствует.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/water:
    post:
      tags:
        - AdminWaterData
      summary: Добавить данные о состоянии воды
      operationId: addWaterData
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaterDataRequestDto'
      responses:
        '201':
          description: Данные о воде успешно созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - AdminWaterData
      summary: Получить список данных о состоянии воды
      operationId: getWaterData
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список записей о состоянии воды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageWaterDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/water/{id}:
    put:
      tags:
        - AdminWaterData
      summary: Обновить данные о состоянии воды
      operationId: updateWaterData
      parameters:
        - name: id
          in: path
          required: true
          description: ID записи воды для обновления
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWaterDataRequestDto'
      responses:
        '200':
          description: Запись о состоянии воды успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - AdminWaterData
      summary: Удалить запись о данных воды
      operationId: deleteWaterData
      parameters:
        - name: id
          in: path
          required: true
          description: ID записи воды для удаления
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Успешное удаление. Тело ответа отсутствует.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/nature-reserve:
    post:
      tags:
        - AdminNatureReserve
      summary: Добавить заповедник
      operationId: addNatureReserve
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatureReserveRequestDto'
      responses:
        '201':
          description: Заповедник успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatureReserveResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - AdminNatureReserve
      summary: Получить список заповедников
      operationId: getNatureReserves
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список заповедников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageNatureReserveResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nature-reserve/{id}:
    put:
      tags:
        - AdminNatureReserve
      summary: Обновить заповедник
      operationId: updateNatureReserve
      parameters:
        - name: id
          in: path
          required: true
          description: ID заповедника для обновления
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNatureReserveRequestDto'
      responses:
        '200':
          description: Заповедник успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatureReserveResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - AdminNatureReserve
      summary: Удалить заповедник
      operationId: deleteNatureReserve
      parameters:
        - name: id
          in: path
          required: true
          description: ID заповедника для удаления
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Успешное удаление. Тело ответа отсутствует.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/points:
    post:
      tags:
        - AdminObservationPoint
      summary: Добавить точку наблюдения
      operationId: addObservationPoint
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationPointRequestDto'
      responses:
        '201':
          description: Точка наблюдения успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPointResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - AdminObservationPoint
      summary: Получить список точек наблюдения
      operationId: getAllObservationPoints
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Количество элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список точек наблюдения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageObservationPointResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/points/{id}:
    put:
      tags:
        - AdminObservationPoint
      summary: Обновить точку наблюдения
      operationId: updateObservationPoint
      parameters:
        - name: id
          in: path
          required: true
          description: ID точки наблюдения
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateObservationPointRequestDto'
      responses:
        '200':
          description: Точка наблюдения успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPointResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - AdminObservationPoint
      summary: Удалить точку наблюдения
      operationId: deleteObservationPoint
      parameters:
        - name: id
          in: path
          required: true
          description: ID точки наблюдения
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Точка наблюдения успешно удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/radiation:
    post:
      tags:
        - AdminRadiationData
      summary: Добавить данные о радиации
      operationId: addRadiationData
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadiationDataRequestDto'
      responses:
        '201':
          description: Данные о радиации успешно созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadiationDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - AdminRadiationData
      summary: Получить список данных о радиации
      operationId: getRadiation
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список записей о радиации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRadiationDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/radiation/{id}:
    put:
      tags:
        - AdminRadiationData
      summary: Обновить данные о радиации
      operationId: updateRadiationData
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRadiationDataRequestDto'
      responses:
        '200':
          description: Данные успешно обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadiationDataResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - AdminRadiationData
      summary: Удалить запись о радиации
      operationId: deleteRadiationData
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Успешное удаление. Тело ответа отсутствует.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/cities:
    get:
      tags:
        - AdminCities
      summary: Получить список городов
      operationId: getCities
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCityResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/regions:
    get:
      tags:
        - AdminRegions
      summary: Получить список регионов
      operationId: getRegions
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список регионов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRegionResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favorite-regions/{id}:
    delete:
      tags:
        - FavoriteRegions
      summary: Удалить регион из избранного
      operationId: removeFavoriteRegion
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID избранного региона для удаления
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Регион успешно удалён из избранного
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favorite-regions/{regionId}:
    post:
      tags:
        - FavoriteRegions
      summary: Добавить регион в избранное
      operationId: addFavoriteRegion
      security:
        - bearerAuth: [ ]
      parameters:
        - name: regionId
          in: path
          required: true
          description: ID региона
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Регион добавлен в избранное
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRegionResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /favorite-regions:
    get:
      tags:
        - FavoriteRegions
      summary: Получить все избранные регионы текущего пользователя
      operationId: getAllFavoriteRegions
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Список избранных регионов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageFavoriteRegionResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /regions/{regionId}/comments:
    get:
      tags:
        - Comments
      security:
        - bearerAuth: [ ]
      summary: Получить все комментарии к региону
      operationId: getAllComments
      parameters:
        - name: regionId
          in: path
          required: true
          description: ID региона
          schema:
            type: string
            format: uuid

        - name: page
          in: query
          required: false
          description: Номер страницы
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: size
          in: query
          required: false
          description: Кол-во элементов на странице
          schema:
            type: integer
            minimum: 1
            default: 10

        - name: direction
          in: query
          required: false
          description: Направление сортировки (`asc` или `desc`)
          schema:
            type: string
            enum: [ asc, desc ]
            default: desc

      responses:
        '200':
          description: Список комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCommentResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Comments
      summary: Добавить комментарий к региону
      operationId: createComment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: regionId
          in: path
          required: true
          description: ID региона
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequestDto'
      responses:
        '201':
          description: Комментарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /comments/{id}:
    patch:
      tags:
        - CommentsModification
      summary: Редактировать комментарий
      operationId: updateComment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID комментария
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequestDto'
      responses:
        '200':
          description: Комментарий успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags:
        - CommentsModification
      operationId: deleteComment
      summary: Удалить комментарий
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID комментария
          schema:
            type: string
            format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Комментарий успешно удалён
        '403':
          $ref: '#/components/responses/AccessDenied'
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequestDto'
      responses:
        '200':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponseDto'
        '400':
